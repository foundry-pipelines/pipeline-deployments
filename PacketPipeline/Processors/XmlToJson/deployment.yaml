apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmltojson
  labels:
    app.kubernetes.io/name: xmltojson
    app.kubernetes.io/part-of: enrichmentpipeline
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: xmltojson
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xmltojson
        app.kubernetes.io/part-of: enrichmentpipeline
      annotations:
        foundry/config-hash: f8725b2e6ea9b609
        foundry/commit: e306ddcedc5c64298792dd2a190524ca8a0b595f
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: xmltojson
        image: registry.gitlab.com/foundry-platform/enrichers/xmltojsonprocessor:e306ddce
        env:
        - name: DOTNET_ENVIRONMENT
          value: Production
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: appsettings
          mountPath: /app/appsettings.json
          subPath: appsettings.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: appsettings
        configMap:
          name: xmltojson-appsettings
      - name: tmp
        emptyDir: {}
